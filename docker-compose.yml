services:
  postgres:
    image: postgres:16-alpine
    container_name: op-anywhere-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: opanywhere
      POSTGRES_PASSWORD: opanywhere
      POSTGRES_DB: opanywhere
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
